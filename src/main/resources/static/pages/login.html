<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LalaPDV - Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-container">
    <div class="login-logo">LalaPDV</div>
    <div class="login-subtitle">Acesso ao Sistema</div>

    <form id="formLogin">
        <div class="form-group">
            <label for="nome">Usuário</label>
            <input type="text" id="nome" placeholder="Digite seu usuário" required>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>

        <div id="loginErro" class="login-erro"></div>
    </form>
</div>

<script src="../js/login.js"></script>

</body>
</html>
